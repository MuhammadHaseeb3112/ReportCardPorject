{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg rounded-4 border-0">
        <div class="card-body p-5">

          <!-- Welcome message -->
          <h3 class="text-center mb-1 fw-bold">
            Welcome back{% if user.is_authenticated %}, {{ user.get_username }}{% endif %}!
          </h3>
          <p class="text-center text-muted mb-4">Please log in to continue</p>

          <!-- Login Form -->
          <form method="post" novalidate>
            {% csrf_token %}

            <div class="mb-3">
              <label for="id_username" class="form-label fw-semibold">Username</label>
              <input type="text" name="username" id="id_username" 
                     class="form-control" value="{{ form.username.value|default_if_none:'' }}" placeholder="Enter your username">
            </div>

            <div class="mb-4">
              <label for="id_password" class="form-label fw-semibold">Password</label>
              <input type="password" name="password" id="id_password" 
                     class="form-control" placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-semibold shadow-sm">
              Login
            </button>
          </form>

          <!-- Extra Links -->
          <div class="mt-4 text-center">
            <p class="mb-1">
              Don’t have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-medium">Sign up</a>
            </p>
            <p>
              <a href="{% url 'password_reset' %}" class="text-decoration-none fw-medium">Forgot your password?</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Optional custom styles -->
<style>
  .card {
    border-radius: 1.5rem;
    transition: transform .3s ease, box-shadow .3s ease;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
  }

  .btn-success:hover {
    transform: scale(1.02);
  }
</style>
{% endblock %}
